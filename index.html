<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under Maintenance</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap');

  :root{
    --bg: #0b2545;
    --bg-deep: #081b36;
    --line: rgba(234, 242, 251, 0.08);
    --ink: #eaf2fb;
    --ink-dim: #7fa8d9;
    --amber: #ffb100;
  }

  *{ box-sizing: border-box; }

  html, body{
    height: 100%;
    margin: 0;
  }

  body{
    background:
      repeating-linear-gradient(0deg, var(--line) 0 1px, transparent 1px 40px),
      repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 40px),
      var(--bg-deep);
    color: var(--ink);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }

  .sheet{
    position: relative;
    width: 100%;
    max-width: 560px;
    padding: 56px 48px;
    border: 1.5px dashed rgba(127, 168, 217, 0.4);
    background: rgba(11, 37, 69, 0.55);
    text-align: center;
  }

  .tick{
    position: absolute;
    width: 18px;
    height: 18px;
    border: 1.5px solid var(--amber);
  }
  .tick.tl{ top: -1.5px; left: -1.5px; border-right: none; border-bottom: none; }
  .tick.tr{ top: -1.5px; right: -1.5px; border-left: none; border-bottom: none; }
  .tick.bl{ bottom: -1.5px; left: -1.5px; border-right: none; border-top: none; }
  .tick.br{ bottom: -1.5px; right: -1.5px; border-left: none; border-top: none; }

  .label{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--ink-dim);
    text-transform: uppercase;
    margin-bottom: 32px;
  }

  .label::before{
    content: "";
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--amber);
    margin-right: 8px;
    animation: pulse 1.6s ease-in-out infinite;
  }

  @keyframes pulse{
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }

  .gear{
    width: 64px;
    height: 64px;
    margin: 0 auto 28px;
    animation: spin 6s linear infinite;
    transform-origin: 50% 50%;
  }

  @media (prefers-reduced-motion: reduce){
    .gear{ animation: none; }
    .label::before{ animation: none; }
  }

  @keyframes spin{
    to { transform: rotate(360deg); }
  }

  h1{
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: clamp(24px, 4vw, 32px);
    letter-spacing: 0.02em;
    margin: 0 0 16px;
  }

  p{
    color: var(--ink-dim);
    font-size: 15px;
    line-height: 1.6;
    max-width: 400px;
    margin: 0 auto;
  }

  .rule{
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 36px 0 28px;
    color: var(--ink-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .rule::before, .rule::after{
    content: "";
    flex: 1;
    height: 1px;
    background: rgba(127, 168, 217, 0.25);
  }

  .contact{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--amber);
    text-decoration: none;
    border-bottom: 1px dashed rgba(255, 177, 0, 0.4);
    padding-bottom: 2px;
    transition: opacity 0.15s ease;
  }

  .contact:hover{ opacity: 0.75; }
  .contact:focus-visible{ outline: 2px solid var(--amber); outline-offset: 4px; }
</style>
</head>
<body>

  <main class="sheet">
    <span class="tick tl"></span>
    <span class="tick tr"></span>
    <span class="tick bl"></span>
    <span class="tick br"></span>

    <div class="label">Status &mdash; in progress</div>

    <svg class="gear" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="32" cy="32" r="10" stroke="#ffb100" stroke-width="2"/>
      <g stroke="#ffb100" stroke-width="2" stroke-linecap="round">
        <line x1="32" y1="4" x2="32" y2="14"/>
        <line x1="32" y1="50" x2="32" y2="60"/>
        <line x1="4" y1="32" x2="14" y2="32"/>
        <line x1="50" y1="32" x2="60" y2="32"/>
        <line x1="12.7" y1="12.7" x2="19.8" y2="19.8"/>
        <line x1="44.2" y1="44.2" x2="51.3" y2="51.3"/>
        <line x1="12.7" y1="51.3" x2="19.8" y2="44.2"/>
        <line x1="44.2" y1="19.8" x2="51.3" y2="12.7"/>
      </g>
    </svg>

    <h1>We're doing some maintenance</h1>
    <p>The site is offline while we make things better. We'll be back shortly &mdash; thanks for your patience.</p>
  </main>

</body>
</html>
